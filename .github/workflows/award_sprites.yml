name: AWARD_SPRITES

on:
  push:
    paths:
      - "uniform-uploads/**"
    branches-ignore:
      - "award-sprites/**"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: award-sprites-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate_sprites:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout the Repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm test` ends with the server suite, which resolves its modules from
      # server/node_modules. Same step LINT_FORMAT_CHECK runs.
      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Generate sprite sheets
        id: generate
        shell: bash
        env:
          # The generator writes the PR title, body and preview image here. The
          # body links to the preview at its future URL; a later step pushes it.
          SPRITE_REPORT_DIR: ${{ runner.temp }}/sprite-report
          SPRITE_PREVIEW_URL: https://raw.githubusercontent.com/${{ github.repository }}/award-sprite-previews/${{ github.run_id }}-${{ github.run_attempt }}.png
        run: |
          # Read the manifest BEFORE generating: the generator empties it on
          # success, so afterwards there is no way to tell a push that had work
          # to do from one that did not, which is what made "no sheet changes"
          # below report a guess as a fact.
          #
          # Both the exit status AND the output are checked. `-e` would already
          # abort the step on a non-zero jq, but jq can also exit 0 having
          # printed nothing (an empty file) or several lines (a stream of
          # documents). Either would leave ENTRY_COUNT non-numeric, and
          # `[ "$ENTRY_COUNT" -gt 0 ]` fails on that WITHOUT tripping `-e`,
          # because a failing `if` condition is not an error — so the guard
          # would silently take the "nothing to generate" branch about a
          # manifest it never read. That is the inference this step exists to
          # remove, so it must not be how the step itself fails.
          if ! ENTRY_COUNT=$(jq 'if type == "array" then length else 1 end' uniform-uploads/manifest.json) \
             || ! [ "$ENTRY_COUNT" -eq "$ENTRY_COUNT" ] 2>/dev/null; then
            echo "::error::could not read uniform-uploads/manifest.json as a JSON document (jq produced '$ENTRY_COUNT')"
            exit 1
          fi
          if [ "$ENTRY_COUNT" -gt 0 ]; then
            echo "had_work=true" >> "$GITHUB_OUTPUT"
          else
            echo "had_work=false" >> "$GITHUB_OUTPUT"
          fi
          npm run sprites:generate
          if [ -f "$SPRITE_REPORT_DIR/title.txt" ]; then
            echo "title=$(cat "$SPRITE_REPORT_DIR/title.txt")" >> "$GITHUB_OUTPUT"
          fi

      # After the generator, not before it. The sprite suite asserts that each
      # committed sheet holds exactly the rows the catalog claims, and it does
      # not read the manifest. The documented upload flow edits the catalog
      # first and leaves the sheets to the generator. Before generation, then,
      # the catalog is one row ahead of every sheet an upload inserts into, and
      # the gate fails on every insert (#234). Run here, the same assertion
      # checks the sheets the pull request will carry. No `if:` on purpose. A
      # push with an empty manifest still runs the whole suite against the
      # committed sheets, which is the regression check main relies on.
      - name: Run tests
        run: npm test
        env:
          MILPAC_TEST_DB_URL: mysql://root:test@127.0.0.1:3306

      - name: Detect sprite-sheet changes
        id: changes
        shell: bash
        env:
          HAD_WORK: ${{ steps.generate.outputs.had_work }}
        run: |
          if [ -n "$(git status --porcelain client/public/skunkworks/)" ]; then
            if [ "$HAD_WORK" != "true" ]; then
              # The other branches were rewritten to stop inferring from git
              # status alone; this is the one that opens the pull request, so it
              # gets the same treatment. A dirty sheet directory with nothing in
              # the manifest to have dirtied it means something other than the
              # generator wrote there — and `add-paths` below would commit it.
              echo "::error::client/public/skunkworks/ changed but the manifest had no entries (had_work='$HAD_WORK'). The generator had nothing to do, so something else wrote there. Not opening a PR."
              exit 1
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$HAD_WORK" = "true" ]; then
            # A backstop, not the identical-art check. The generator answers
            # that itself now, per tile and on pixels, before it deletes
            # anything — which git cannot do from out here. "The file changed"
            # is a question about the encoder, and it is not the question:
            # a sheet carries many awards, so identical bytes are not what "this
            # award's tile did not change" means, and the inference rots on any
            # sharp bump besides. Reaching this branch means the generator
            # claimed to have spliced something and the working tree disagrees —
            # no known cause, so fail rather than guess one.
            echo "::error::Manifest had entries and the generator reported success, but no sprite sheet changed on disk. That combination is not expected — the generator refuses a no-op run itself. Do not merge; report this with the run log attached."
            exit 1
          elif [ "$HAD_WORK" = "false" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Manifest was empty; nothing to generate. Skipping PR."
          else
            echo "::error::had_work was '$HAD_WORK'; the manifest probe did not run, so whether there was work to do is unknown"
            exit 1
          fi

      - name: Verify formatting
        if: steps.changes.outputs.changed == 'true'
        run: npm run format:check

      # The PR below MUST NOT be opened with the default GITHUB_TOKEN. Events
      # triggered by that token do not start workflow runs, so LINT_FORMAT_CHECK
      # would never report on the PR — and `main` requires that check, which
      # would leave every sprite PR permanently unmergeable. An App
      # installation token is an ordinary actor, so the push and the PR fire
      # workflows normally. Minted only when there is a PR to open; revoked
      # automatically when the job ends.
      - name: Mint sprite-bot token
        id: app-token
        if: steps.changes.outputs.changed == 'true'
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ secrets.SPRITE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SPRITE_BOT_PRIVATE_KEY }}

      # GitHub has no API to attach an image to a PR body, so the preview lives
      # on its own branch, which never merges. Pushed before the PR opens
      # because the body already links to it.
      - name: Publish preview image
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          PREVIEW: ${{ runner.temp }}/sprite-report/preview.png
          FILE: ${{ github.run_id }}-${{ github.run_attempt }}.png
        run: |
          set -euo pipefail
          # Runs on other branches push here too, so a push can lose a race.
          # FILE is unique per run, so retrying on the new tip cannot conflict.
          for attempt in 1 2 3; do
            # A fresh repo per attempt, so nothing carries over from a failed one.
            cd "$(mktemp -d)"
            git init -q
            git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            # ls-remote exits 2 when the branch does not exist yet; then the
            # first commit here starts it. Anything else is a real failure.
            status=0
            git ls-remote --exit-code --heads origin award-sprite-previews > /dev/null || status=$?
            case "$status" in
              0)
                git fetch -q --depth 1 origin award-sprite-previews
                git checkout -q FETCH_HEAD
                ;;
              2) ;;
              *) exit "$status" ;;
            esac
            cp "$PREVIEW" "$FILE"
            git add "$FILE"
            # The runner has no git identity; commit as the Actions bot.
            git -c user.name="github-actions[bot]" \
                -c user.email="41898297+github-actions[bot]@users.noreply.github.com" \
                commit -q -m "Award sprite preview $FILE"
            git push -q origin HEAD:refs/heads/award-sprite-previews && exit 0
            [ "$attempt" -lt 3 ] && sleep $((attempt * 5))
          done
          exit 1

      - name: Open pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: award-sprites/${{ github.ref_name }}
          base: ${{ github.ref_name }}
          add-paths: |
            client/public/skunkworks/**
            uniform-uploads/**
          commit-message: ${{ steps.generate.outputs.title }}
          title: ${{ steps.generate.outputs.title }}
          body-path: ${{ runner.temp }}/sprite-report/pr-body.md
