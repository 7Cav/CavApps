name: LINT_FORMAT_CHECK

on:
  pull_request:
    branches:
      - main

jobs:
  lint_format_check:
    runs-on: ubuntu-latest

    # A throwaway MariaDB for server/db/milpacDb.test.js, which needs a real
    # server to run the forum queries against.
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout the Repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Prettier check
        run: npm run format:check

      - name: Tests
        run: npm test
        env:
          MILPAC_TEST_DB_URL: mysql://root:test@127.0.0.1:3306
